basePath: /api
definitions:
  dto.AuthResponse:
    properties:
      access_token:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.ChangePasswordRequest:
    properties:
      current_password:
        type: string
      new_password:
        minLength: 6
        type: string
    required:
    - current_password
    - new_password
    type: object
  dto.GenreStatResponse:
    properties:
      genre:
        type: string
      play_count:
        type: integer
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.PlayHistoryItem:
    properties:
      event_id:
        type: string
      played_at:
        type: string
      track:
        $ref: '#/definitions/dto.TrackResponse'
    type: object
  dto.PlayHistoryResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.PlayHistoryItem'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total_count:
        type: integer
    type: object
  dto.PlaylistResponse:
    properties:
      album_cover:
        type: string
      created_at:
        type: string
      id:
        type: string
      title:
        type: string
      track_ids:
        items:
          type: string
        type: array
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 6
        type: string
      role_key:
        description: Pass ADMIN_ROLE_KEY to register as admin
        type: string
    required:
    - email
    - name
    - password
    type: object
  dto.SummaryResponse:
    properties:
      top_genres:
        items:
          $ref: '#/definitions/dto.GenreStatResponse'
        type: array
      total_plays:
        type: integer
      total_tracks:
        type: integer
    type: object
  dto.TopTrackResponse:
    properties:
      play_count:
        type: integer
      track:
        $ref: '#/definitions/dto.TrackResponse'
    type: object
  dto.TopTracksResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.TopTrackResponse'
        type: array
    type: object
  dto.TrackListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.TrackResponse'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total_count:
        type: integer
    type: object
  dto.TrackResponse:
    properties:
      album:
        type: string
      artist:
        type: string
      created_at:
        type: string
      duration:
        type: integer
      file_id:
        type: string
      genre:
        type: string
      id:
        type: string
      release_year:
        type: integer
      title:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  dto.TrackStatsResponse:
    properties:
      play_count:
        type: integer
      track_id:
        type: string
    type: object
  dto.UpdateRoleRequest:
    properties:
      role:
        enum:
        - admin
        - artist
        - user
        type: string
    required:
    - role
    type: object
  dto.UpdateTrackRequest:
    properties:
      album:
        type: string
      artist:
        type: string
      genre:
        type: string
      release_year:
        type: integer
      title:
        type: string
    required:
    - artist
    - title
    type: object
  dto.UpdateUserInfoRequest:
    properties:
      email:
        type: string
      name:
        type: string
    required:
    - email
    - name
    type: object
  dto.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      role:
        type: string
      updated_at:
        type: string
    type: object
  dto.UserStatsResponse:
    properties:
      top_tracks:
        items:
          $ref: '#/definitions/dto.TopTrackResponse'
        type: array
      total_plays:
        type: integer
    type: object
info:
  contact: {}
  description: Clean architecture Music Library API with Golang (Gin) + MongoDB, featuring
    CRUD, MP3 uploads, search, and basic MP3 streaming.
  title: Music Library API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user. Returns access_token in body and refresh_token
        as HttpOnly cookie.
      parameters:
      - description: User login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login user — returns access_token in body, refresh_token as HttpOnly
        cookie
      tags:
      - auth
  /auth/logout:
    post:
      description: Revoke the current user's session and clear the refresh_token cookie.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Logout — revokes session and clears cookie
      tags:
      - auth
  /auth/refresh:
    post:
      description: Refresh access token using the HttpOnly refresh_token cookie.
      parameters:
      - description: refresh_token cookie
        in: header
        name: Cookie
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh access token using the HttpOnly refresh_token cookie
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account. Provide role_key only when registering
        as admin.
      parameters:
      - description: User registration info
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - auth
  /playlists:
    get:
      consumes:
      - application/json
      description: Retrieve paginated playlists
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get all playlists
      tags:
      - Playlists
    post:
      consumes:
      - multipart/form-data
      description: Create new playlist
      parameters:
      - description: Playlist title
        in: formData
        name: title
        required: true
        type: string
      - description: Album cover image
        in: formData
        name: album_cover
        type: file
      - collectionFormat: csv
        description: Track IDs
        in: formData
        items:
          type: string
        name: track_ids
        type: array
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.PlaylistResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create playlist
      tags:
      - Playlists
  /playlists/{id}:
    delete:
      consumes:
      - application/json
      description: Remove playlist by ID
      parameters:
      - description: Playlist ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete playlist
      tags:
      - Playlists
    get:
      consumes:
      - application/json
      description: Get playlist detail
      parameters:
      - description: Playlist ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PlaylistResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get playlist by ID
      tags:
      - Playlists
    patch:
      consumes:
      - multipart/form-data
      description: Update playlist by ID (partial update, form-data)
      parameters:
      - description: Playlist ID
        in: path
        name: id
        required: true
        type: string
      - description: Playlist title
        in: formData
        name: title
        type: string
      - description: Album cover image
        in: formData
        name: album_cover
        type: file
      - collectionFormat: csv
        description: Track IDs, comma separated
        in: formData
        items:
          type: string
        name: track_ids
        type: array
      - default: append
        description: Track update mode
        enum:
        - append
        - overwrite
        in: formData
        name: mode
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PlaylistResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update playlist
      tags:
      - Playlists
  /playlists/{id}/stream:
    get:
      description: Streams an M3U playlist file containing URLs to the MP3 tracks.
      parameters:
      - description: Playlist ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - audio/x-mpegurl
      responses:
        "200":
          description: M3U playlist content
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Stream playlist as M3U
      tags:
      - Playlists
  /stats/summary:
    get:
      description: Get total plays, total tracks, and top genres
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SummaryResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get system summary
      tags:
      - stats
  /stats/top-tracks:
    get:
      description: Get globally most-played tracks
      parameters:
      - description: Number of tracks (max 50, default 10)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TopTracksResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get top tracks
      tags:
      - stats
  /tracks:
    get:
      consumes:
      - application/json
      description: Retrieve a paginated list of tracks
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TrackListResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get list of tracks
      tags:
      - tracks
    post:
      consumes:
      - multipart/form-data
      description: Upload a new MP3 track and save metadata
      parameters:
      - description: Artist
        in: formData
        name: artist
        required: true
        type: string
      - description: Album
        in: formData
        name: album
        type: string
      - description: Genre
        in: formData
        name: genre
        type: string
      - description: Release Year
        in: formData
        name: release_year
        type: integer
      - description: MP3 File
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.TrackResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Upload a new track
      tags:
      - tracks
  /tracks/{id}:
    delete:
      description: Delete a track by ID
      parameters:
      - description: Track ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a track
      tags:
      - tracks
    get:
      description: Retrieve a single track by its ID
      parameters:
      - description: Track ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TrackResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get track by ID
      tags:
      - tracks
    patch:
      consumes:
      - application/json
      description: Update track metadata by ID
      parameters:
      - description: Track ID
        in: path
        name: id
        required: true
        type: string
      - description: Track update info
        in: body
        name: track
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateTrackRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TrackResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update a track
      tags:
      - tracks
  /tracks/{id}/play:
    post:
      description: Record that a track was played. Auth optional — guest plays are
        tracked anonymously.
      parameters:
      - description: Track ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "202":
          description: Accepted
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Record a play event
      tags:
      - stats
  /tracks/{id}/stats:
    get:
      description: Get total play count for a specific track
      parameters:
      - description: Track ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TrackStatsResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get track play count
      tags:
      - stats
  /tracks/{id}/stream:
    get:
      description: Stream MP3 file, support Range header
      parameters:
      - description: Track ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - audio/mpeg
      responses:
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Stream an audio track
      tags:
      - tracks
  /tracks/search:
    get:
      description: Search tracks by query string
      parameters:
      - description: Search query
        in: query
        name: q
        required: true
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TrackListResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Search tracks
      tags:
      - tracks
  /users:
    get:
      description: Admin only — get paginated list of all users
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List all users
      tags:
      - users
  /users/{id}:
    get:
      description: Admin only — get a single user by ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get user by ID
      tags:
      - users
  /users/{id}/info:
    patch:
      consumes:
      - application/json
      description: Admin only — update any user's name and email
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: User info
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateUserInfoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update user info
      tags:
      - users
  /users/{id}/role:
    patch:
      consumes:
      - application/json
      description: Admin only — change a user's role
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: New role
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update user role
      tags:
      - users
  /users/me:
    get:
      description: Get the profile of the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: Update the authenticated user's own name and email
      parameters:
      - description: User info
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateUserInfoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update current user
      tags:
      - users
  /users/me/history:
    get:
      description: Get the current user's play history, sorted newest first
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PlayHistoryResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get play history
      tags:
      - stats
  /users/me/password:
    patch:
      consumes:
      - application/json
      description: Change the authenticated user's own password
      parameters:
      - description: Password change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - users
  /users/me/stats:
    get:
      description: Get total plays and top tracks for the current user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserStatsResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get personal stats
      tags:
      - stats
securityDefinitions:
  BearerAuth:
    description: Type "Bearer {your token}" to authenticate.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
